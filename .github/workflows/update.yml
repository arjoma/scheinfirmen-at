name: Daten Aktualisieren

on:
  schedule:
    # Twice a day. The BMF edits the list during office hours (Vienna), so a
    # morning and an afternoon run publish changes the same day. GitHub often
    # starts scheduled runs late (hours, not minutes); odd minutes help a bit.
    # 06:17 UTC = 07:17 CET / 08:17 CEST, 14:17 UTC = 15:17 CET / 16:17 CEST
    - cron: "17 6,14 * * *"
  workflow_dispatch:  # Allow manual trigger
    inputs:
      max_removals:
        description: "Abort if more entries than this disappeared (raise for a deliberate BMF clean-up)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --locked

      # The previous data/ is the baseline: the CLI diffs against it to keep
      # the "geaendert" timestamp, log removals and guard against truncation.
      - name: Download, validate, and convert Scheinfirmen data
        run: >-
          uv run scheinfirmen-at --output-dir data/ --stats data/STATS.md --verbose
          --max-removals "${{ inputs.max_removals || '25' }}"

      - name: Extract Stand timestamp (fails if not present)
        id: stand
        run: |
          STAND=$(head -n 1 data/scheinfirmen.jsonl | jq -r '._metadata.stand // empty')
          if [ -z "$STAND" ]; then
            echo "ERROR: Could not extract Stand timestamp from data/scheinfirmen.jsonl" >&2
            exit 1
          fi
          echo "value=$STAND" >> "$GITHUB_OUTPUT"

      # Stand is regenerated by the BMF on every request, so timestamp-only
      # changes (JSONL metadata line, XML root element) are ignored.
      # --intent-to-add makes newly created files visible to git diff.
      - name: Check for changes in data/ (ignore timestamp-only changes)
        id: changes
        run: |
          git add --intent-to-add data/
          git diff \
            -I '"_metadata"' \
            -I "<scheinfirmen " \
            --quiet -- data/ ':!data/STATS.md' \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Scheinfirmen data (Stand: ${{ steps.stand.outputs.value }})"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "Data is already up to date (Stand: ${{ steps.stand.outputs.value }})"
